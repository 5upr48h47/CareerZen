# CareerZen — Render + external PostgreSQL deployment
#
# This Blueprint deploys ONE Render Web Service. The database is intentionally
# NOT provisioned by Render: set DATABASE_URL to your external PostgreSQL
# provider (for example Neon) in the Render dashboard.
#
# Flow:
#   GitHub -> Render Web Service -> external PostgreSQL
#
# The Express server serves the Vite-built React SPA, so frontend and API use
# one origin and one HTTPS URL.

services:
  - type: web
    name: careerzen
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: LOG_LEVEL
        value: warn
      - key: DB_PROVIDER
        value: postgresql
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SEED_DEMO
        value: "false"

# No databases: block here. DATABASE_URL is supplied manually from the
# external PostgreSQL provider so the database is independent of Render.
