# CareerZen — Render deployment (free tier).
#
# Setup:
#   1. Push this repo to GitHub
#   2. Render dashboard → New → Blueprint → point at the repo
#   3. Render reads this file and provisions everything below
#
# The web service builds the React app and serves it from Express, so the SPA
# and the API share one origin — no CORS, no proxy, one TLS cert.

services:
  - type: web
    name: careerzen
    runtime: node
    plan: free
    region: singapore
    # The app is authored against SQLite (schema.prisma) but Render provisions
    # PostgreSQL. At build time we derive the postgres variant of the schema,
    # generate a PostgreSQL Prisma Client, and at start time push the schema so
    # the empty provisioned database gets its tables. Without the postgres
    # switch the server starts with a SQLite engine against a Postgres URL and
    # every query fails; without db push the database has no tables at all.
    # DATABASE_URL is only resolved at runtime (fromDatabase above), so the build
    # step needs a placeholder or `prisma generate` fails URL validation. The
    # value is discarded — the generated client is provider-bound, not URL-bound.
    # The repo has no root package.json dependencies, so the leading
    # `npm install` installs nothing and the subsequent `--prefix server`
    # install has no node_modules to link against. Drop it and install each
    # package directly. (The CI workflow uses `npm ci` because it has a
    # package-lock.json; Render's build container does not.)
    buildCommand: DATABASE_URL="postgresql://build@localhost:5432/build" npm install --prefix server && npm install --prefix client && npm --prefix client run build && DATABASE_URL="postgresql://build@localhost:5432/build" npm --prefix server run db:postgres:generate
    startCommand: npm --prefix server run db:postgres:push && node server/src/index.js
    healthCheckPath: /api/health
    # Free-tier services sleep after inactivity and are capped at 512 MB RAM.
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      # Set these in the Render dashboard (marked sync:false so they are not
      # committed to this file):
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: careerzen-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: LOG_LEVEL
        value: warn
      # Live Razorpay keys — real payments fail without these.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      # Free Gemini key enables real LLM inference for the AI features.
      - key: GEMINI_API_KEY
        sync: false
      # Keep the demo accounts (password123, includes a recruiter) out of prod.
      - key: SEED_DEMO
        value: "false"

databases:
  - name: careerzen-db
    databaseName: careerzen
    # Free PostgreSQL expires after 30 days on Render; the free Neon tier
    # does not. Swap this block for a Neon connection string if you want the
    # database to persist long-term.
    plan: free
    postgresMajorVersion: "16"